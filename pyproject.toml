[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patternity"
version = "0.2.1"
description = "A StepMania file parser and pattern analyzer."
readme = "README.md"
authors = [
    { name = "Brandon Abear", email = "barndoorabear@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "rich>=15.0.0",
]

[project.scripts]
patternity = "patternity.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "regression: read/parse/analyze against canonical fixtures",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-mock>=3.17.0",
    "ruff>=0.16.3",
    "ty>=0.0.95",
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E5", "E7", "E9", "F", "I"]
