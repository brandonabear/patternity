<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 670" width="930" height="670" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
<title>Playfield and footing trellis for three 8th notes: down, up, down</title>
<desc>Left: the playfield (Left, Down, Up, Right panels) for three consecutive 8th notes, down, up, down, with arrows colored by quantization: red on 4th-note beats, blue on 8th-note beats. Right: the Viterbi trellis for the same rows, starting from a neutral stance. Each row shows the left-foot-moved state on the left and the right-foot-moved state on the right. The minimum-cost path (white-outlined nodes, solid edges) goes right, left, right; every alternative branches from the winning node above it.</desc>
<style>.row{font-weight:600} .lbl{font-size:12px} .foot{font-size:17px;font-weight:700;fill:#fff;stroke:#000;stroke-width:0.6;paint-order:stroke}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ececec"/></marker><marker id="arrowDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a9a9a"/></marker></defs>
<rect width="930" height="670" fill="#1f2023"/>
<rect x="240" y="10" width="660" height="110" rx="8" fill="#c9c9c9" stroke="#555" stroke-dasharray="2 4" stroke-linecap="round"/>
<text x="254" y="32" class="row" fill="#222">Start</text>
<rect x="240" y="170" width="660" height="120" rx="8" fill="#3b1d21" stroke="#e5484d"/>
