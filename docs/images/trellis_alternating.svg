<rect x="240" y="350" width="660" height="120" rx="8" fill="#18263f" stroke="#4b8df8"/>
<text x="254" y="372" class="row" fill="#a9c6fb">Row 2: Up Arrow</text>
<rect x="240" y="530" width="660" height="120" rx="8" fill="#3b1d21" stroke="#e5484d"/>
<text x="254" y="552" class="row" fill="#f5b5b8">Row 3: Down Arrow</text>
<text x="122.0" y="34" text-anchor="middle" class="row" fill="#ececec">Playfield</text>
<text x="122.0" y="52" text-anchor="middle" class="lbl" fill="#9a9a9a">3 consecutive 8th notes</text>
<g transform="translate(32 78) scale(0.5) rotate(0)"><polygon points="0,-13 12,0 5,0 5,12 -5,12 -5,0 -12,0" fill="#ff4d4d" stroke="#000" stroke-width="2" stroke-linejoin="round"/></g>
<text x="48" y="82" class="lbl" fill="#ececec">4th-note beat</text>
<g transform="translate(32 98) scale(0.5) rotate(0)"><polygon points="0,-13 12,0 5,0 5,12 -5,12 -5,0 -12,0" fill="#3b82f6" stroke="#000" stroke-width="2" stroke-linejoin="round"/></g>
<text x="48" y="102" class="lbl" fill="#ececec">8th-note beat</text>
