<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 1040" width="930" height="1040" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
<title>Playfield and footing trellis for a crossover bracket: right, down, left and up, down, right</title>
<desc>Left: the playfield for five 16th-note steps at 150 BPM, Right, Down, Left and Up together, Down, Right, with arrows colored by quantization and labeled with the winning foot, R, L, R and R, L, R. Right: the Viterbi trellis for the same rows, starting from a neutral stance. The minimum-cost path (white-outlined nodes, solid edges) has the right foot bracket Left and Up across the left foot, which stays on Down, a crossover bracket, rather than jumping with both feet. Every alternative branches from the winning node above it.</desc>
<style>.row{font-weight:600} .lbl{font-size:12px} .foot{font-size:17px;font-weight:700;fill:#fff;stroke:#000;stroke-width:0.6;paint-order:stroke}</style>
