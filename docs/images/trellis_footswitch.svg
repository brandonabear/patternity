<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 930" width="930" height="930" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
<title>Playfield and footing trellis for a footswitch: left, down, down, right with a mine cue</title>
<desc>Left: the playfield for four 16th-note steps, Left, Down, Down, Right, with a mine on the Left panel, under the left foot, between the two Down steps; arrows are colored by quantization and labeled with the winning foot, L, R, L, R. Right: the Viterbi trellis for the same rows, starting from a neutral stance. The minimum-cost path (white-outlined nodes, solid edges) alternates feet; the right foot hits Down, the mine on Left forces the left foot to step off Left, and it takes over Down, which is a footswitch. Every alternative branches from the winning node above it.</desc>
<style>.row{font-weight:600} .lbl{font-size:12px} .foot{font-size:17px;font-weight:700;fill:#fff;stroke:#000;stroke-width:0.6;paint-order:stroke}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ececec"/></marker><marker id="arrowDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a9a9a"/></marker></defs>
