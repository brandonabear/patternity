<g transform="translate(126 432) scale(0.6)"><polygon points="0,-13 12,0 5,0 5,12 -5,12 -5,0 -12,0" fill="#3b82f6" stroke="#000" stroke-width="2" stroke-linejoin="round"/></g>
<text x="138" y="436" class="lbl" fill="#ececec">8th note</text>
<g transform="translate(216 432) scale(0.6)"><polygon points="0,-13 12,0 5,0 5,12 -5,12 -5,0 -12,0" fill="#3ddc84" stroke="#000" stroke-width="2" stroke-linejoin="round"/></g>
