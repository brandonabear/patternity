<text x="210.0" y="272.0" text-anchor="middle" class="foot">R</text>
<g transform="translate(210.0 316.0) rotate(90) scale(1.6)"><polygon points="0,-13 12,0 5,0 5,12 -5,12 -5,0 -12,0" fill="#3ddc84" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/></g>
<text x="210.0" y="322.0" text-anchor="middle" class="foot">R</text>
