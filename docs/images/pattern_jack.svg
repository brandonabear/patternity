<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 414 464" width="414" height="464" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
<title>Jack example</title>
<desc>Jack at 120 BPM: L (4th, L), R (8th, R), R (16th, R); 1 jack detected.</desc>
<style>.title{font-size:20px;font-weight:700} .cap{font-weight:600} .lbl{font-size:12px} .foot{font-size:17px;font-weight:700;fill:#fff;stroke:#000;stroke-width:0.6;paint-order:stroke}</style>
<rect width="414" height="464" fill="#1f2023"/>
<text x="28" y="38" class="title" fill="#ececec">Jack</text>
<text x="28" y="58" class="lbl" fill="#9a9a9a">120 BPM</text>
<rect x="28" y="76.0" width="208" height="316.0" rx="6" fill="#2a2b2f"/>
<line x1="28" y1="166.0" x2="236" y2="166.0" stroke="#6a6b70" stroke-width="2"/>
<line x1="28" y1="366.0" x2="236" y2="366.0" stroke="#3a3b40" stroke-width="1"/>
<g transform="translate(54.0 102.0) rotate(270) scale(1.6)"><polygon points="0,-13 12,0 5,0 5,12 -5,12 -5,0 -12,0" fill="none" stroke="#5a5b60" stroke-width="1.2" stroke-linejoin="round"/></g>
<g transform="translate(106.0 102.0) rotate(180) scale(1.6)"><polygon points="0,-13 12,0 5,0 5,12 -5,12 -5,0 -12,0" fill="none" stroke="#5a5b60" stroke-width="1.2" stroke-linejoin="round"/></g>
<g transform="translate(158.0 102.0) rotate(0) scale(1.6)"><polygon points="0,-13 12,0 5,0 5,12 -5,12 -5,0 -12,0" fill="none" stroke="#5a5b60" stroke-width="1.2" stroke-linejoin="round"/></g>
<g transform="translate(210.0 102.0) rotate(90) scale(1.6)"><polygon points="0,-13 12,0 5,0 5,12 -5,12 -5,0 -12,0" fill="none" stroke="#5a5b60" stroke-width="1.2" stroke-linejoin="round"/></g>
<path d="M246,266.0 h8 V316.0 h-8" fill="none" stroke="#f5c542" stroke-width="2"/>
<text x="260" y="289.0" class="cap" fill="#f5c542">jack</text>
<text x="260" y="305.0" class="lbl" fill="#9a9a9a">0.125 s</text>
<g transform="translate(54.0 166.0) rotate(270) scale(1.6)"><polygon points="0,-13 12,0 5,0 5,12 -5,12 -5,0 -12,0" fill="#ff4d4d" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/></g>
<text x="54.0" y="172.0" text-anchor="middle" class="foot">L</text>
